hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - train.criterion.max_weight=30,50,100,150
  job:
    name: main
    chdir: null
    override_dirname: train.criterion.max_weight=30,50,100,150
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/jinsu/VscodeProjects/CustomDMVST
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jinsu/VscodeProjects/CustomDMVST/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
project_name: Custom DMVSTNet
seed: 42
device: cuda
dataset:
  root: ./data
  time_step: 4
loader:
  train:
    ratio: 0.7
    batch_size: 50
    shuffle: true
  val:
    ratio: 0.15
    batch_size: 50
    shuffle: false
  test:
    ratio: 0.15
    batch_size: 100
    shuffle: false
model:
  temporal_data_size: ${dataset.time_step}
  GNN:
    k: 2
    conv_in:
      act_first: true
    conv_hidden:
      hidden_channels: 7
      act: ReLU
      act_first: true
    conv_out:
      out_channels: 4
      num_layers: 3
      act_first: true
  LSTM:
    hidden_size: 12
    num_layers: 1
    bias: true
    batch_first: true
    bidirectional: false
    proj_size: 0
train:
  epochs: 50
  learning_rate: 0.005
  weight_decay: 0.001
  shuffle: true
  validation_split: 0.1
  test_split: 0.2
  scheduler:
    type: StepLR
    params:
      step_size: 10
      gamma: 0.5
  optimizer:
    type: AdamW
    params:
      lr: 0.005
      weight_decay: 0.001
  criterion:
    max_weight: 30
test:
  save_root: ./test_results
