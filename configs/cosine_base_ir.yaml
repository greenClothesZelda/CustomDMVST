project_name: cosine_base_ir
seed: 42
device: cuda

dataset:
  root: data/raw
  size: 7000

split:
  train_ratio: 0.8

model:
  STResNet:
    nb_flow: 1
    len_c: 3
    len_p: 1
    len_t: 1
    period_interval: 24
    trend_interval: 168
    nb_filter: 64
    nb_residual_unit: 12
    use_external: true
    external_hidden: 64

train:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 128
  num_train_epochs: 60
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: rmse
  greater_is_better: false

hydra:
  run:
    dir: outputs/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
