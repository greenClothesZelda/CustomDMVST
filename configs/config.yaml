project_name: Custom DMVSTNet
seed: 42
device: cuda
dataset:
  root: ./data
  time_step: 5
loader:
  train:
    ratio: 0.7
    batch_size: 50
    shuffle: true
  val:
    ratio: 0.15
    batch_size: 1000
    shuffle: false
  test:
    ratio: 0.15
    batch_size: 100
    shuffle: false
model:
  temporal_data_size: ${dataset.time_step}
  Node_GNN:
    k: 3
    conv_in:
      act_first: true
    conv_hidden:
      hidden_channels: 8
      act: GELU
      act_first: true
    conv_out:
      out_channels: 5
      num_layers: 3
      act_first: true
  Node_LSTM:
    hidden_size: 12
    num_layers: 1
    bias: false
    bidirectional: false
    proj_size: 0
  Aggregated_LSTM:
    hidden_size: 12
    num_layers: 1
    bias: false
    bidirectional: false
    proj_size: 0
  Meteorological:
    in_features: 4
    out_features: 2
train:
  epochs: 500
  shuffle: true
  validation_split: 0.1
  test_split: 0.2
  alpha: 0.0
  patience: 20
  scheduler:
    type: StepLR
    params:
      step_size: 10
      gamma: 0.5
  optimizer:
    type: AdamW
    params:
      lr: 0.0005
      weight_decay: 0.001
test:
  save_root: ./test_results
