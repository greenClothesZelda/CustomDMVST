project_name: "Custom DMVSTNet"
seed: 42
device: "cuda"


dataset:

model:
  
train:
    epochs: 20
    learning_rate: 0.005
    weight_decay: 0.001
    shuffle: True

    validation_split: 0.1
    test_split: 0.2

    time_steps: 24

    scheduler:
        type: "StepLR"
        step_size: 10
        gamma: 0.5

    optimizer: "adam"


